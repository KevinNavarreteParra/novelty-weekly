[package]
name = "novelty"
version = "0.1.0"
edition = "2024"
description = "A self-hosted weekly playlist where novelty is the objective function."
repository = "https://github.com/KevinNavarreteParra/novelty-weekly"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
jiff = { version = "0.2.41", features = ["serde"] }
log = "0.4.35"
rand = "0.10.3"
rand_distr = "0.6.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strsim = "0.11.1"
toml = "1.2.1"
ureq = { version = "3.5.1", features = ["json"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
